<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>boot-effect, minimal example</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1015; }
    #intro { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="intro"></div>
  <script src="../../dist/boot-effect.js"></script>
  <script>
    // Serve the repository root (for example `npx serve .`), then open /examples/vanilla/.
    new BootEffect("#intro", {
      photo: "../../site/assets/lake.jpg",
      sky: { mode: "warm", horizon: 0.49 },
      layout: { position: "absolute", top: 0, left: 0, width: "100%", height: "100%" },
      loop: true
    });
  </script>
</body>
</html>
